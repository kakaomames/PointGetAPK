Name: Android APK Build Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # GitHubの画面から手動実行ボタンを押して動かすことも可能

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: JDK 17 のセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # 17に修正！

      - name: Gradleのキャッシュ設定 (ビルド爆速化)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: gradlew に実行権限を付与
        run: |
           chmod +x gradlew

      - name: Android Debug APK のビルド
        run: ./gradlew assembleDebug

      - name: 生成された APK を Artifacts にアップロード
        uses: actions/upload-artifact@v4
        with:
          name: poikatsu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
